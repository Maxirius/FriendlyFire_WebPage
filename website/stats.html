<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Statistiken · FriendlyFire Minecraft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<style>
.hero{padding:44px 0 10px;}
.hero h1{font-size:26px;font-weight:700;letter-spacing:-.01em;}
.hero .sub{color:var(--muted);font-size:14px;}
.back-link{color:var(--muted);text-decoration:none;font-size:13px;}
.back-link:hover{color:var(--ink);}

.cat-tabs{
  display:flex;gap:8px;flex-wrap:wrap;margin:26px 0 22px;
}
.cat-tab{
  appearance:none;cursor:pointer;border:1px solid var(--border);
  background:var(--panel-2);color:var(--muted);
  font-family:var(--font-mono);font-size:12px;font-weight:600;
  padding:9px 16px;letter-spacing:.05em;text-transform:uppercase;
  transition:color .15s,border-color .15s;
}
.cat-tab:hover{color:var(--ink);border-color:var(--muted);}
.cat-tab.active{color:var(--accent-ink);background:var(--accent);
  border-color:var(--accent);}

.big-icon{
  font-size:34px;line-height:1;flex:none;
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.4));
}
.board h4{
  display:flex;align-items:center;gap:10px;
  font-size:14px;color:var(--ink);text-transform:none;
  letter-spacing:0;margin-bottom:12px;
}
.board h4 .bi{
  font-size:26px;line-height:1;flex:none;
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.4));
}
.board h4 .bu{font-family:var(--font-mono);font-size:10px;color:var(--muted);
  margin-left:auto;letter-spacing:.05em;}
.grid-main{display:grid;grid-template-columns:260px 1fr;gap:26px;
  padding:0 0 90px;align-items:start;}
@media(max-width:900px){.grid-main{grid-template-columns:1fr;}}
.sidebar{
  border:1px solid var(--border);background:var(--panel);
  padding:18px;position:sticky;top:84px;
}
.sidebar h3{font-family:var(--font-mono);font-size:11px;color:var(--muted);
  letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px;}
.sb-cat{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  appearance:none;background:none;border:none;cursor:pointer;
  color:var(--muted);font-size:14px;padding:9px 10px;
  border-left:2px solid transparent;font-family:inherit;
  transition:color .15s,border-color .15s,background .15s;
}
.sb-cat:hover{color:var(--ink);background:var(--panel-2);}
.sb-cat.active{color:var(--accent);border-left-color:var(--accent);
  background:var(--panel-2);}
.sb-cat .ci{font-size:20px;flex:none;}
.sb-count{margin-left:auto;font-family:var(--font-mono);font-size:10px;
  color:var(--muted);}
.profiles-block{margin-bottom:26px;}
.profiles-block h3{font-family:var(--font-mono);font-size:11px;color:var(--muted);
  letter-spacing:.08em;text-transform:uppercase;margin-bottom:14px;}
.updated{font-family:var(--font-mono);font-size:11px;color:var(--muted);
  margin-top:20px;}
</style>
</head>
<body>

<header class="top">
  <div class="wrap nav">
    <!-- PLACEHOLDER: wordmark = technisch bis Markenname steht -->
    <a class="wordmark" href="/">MC.<em>MAX-KUEHN</em>.COM</a>
    <nav class="userarea" id="userArea"><span class="chip">&nbsp;</span></nav>
  </div>
</header>

<main class="wrap">

  <div class="toast" id="toast"></div>

  <div class="hero">
    <a class="back-link" href="/">← Zurück zur Übersicht</a>
    <h1>Statistiken</h1>
    <p class="sub">Ingame-Zahlen unserer Spieler — live aus der Welt,
      archiviert auf dem Server.</p>
  </div>

  <div class="grid-main">

    <aside class="sidebar">
      <h3>Kategorien</h3>
      <div id="catSidebar"></div>
    </aside>

    <div>
      <div class="profiles-block">
        <h3>Spieler</h3>
        <div class="profile-tiles" id="profileTiles" style="margin-top:0"></div>
      </div>

      <div id="boardArea"><!-- populated --></div>
      <p class="updated" id="updatedLine"></p>
    </div>

  </div>
</main>

<footer class="wrap">
  <span>&copy; <span id="yr"></span> FriendlyFire · Minecraft-Community</span>
  <span class="mono-sm" style="color:var(--muted)">statistik-bereich ·
    <button class="linkish" id="logoutBtn" style="padding:0">Abmelden</button></span>
</footer>

<script>
'use strict';
const qs=s=>document.querySelector(s);
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;',
  '>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const ICON_EMOJI={
  'minecraft:experience_bottle':'🧪','minecraft:clock':'🕐','minecraft:wheat':'🌾',
  'minecraft:fishing_rod':'🎣','minecraft:emerald':'💚','minecraft:enchanted_book':'📖',
  'minecraft:red_bed':'🛏️','minecraft:rabbit_foot':'🐇','minecraft:compass':'🧭',
  'minecraft:leather_boots':'👟','minecraft:sugar':'🏃','minecraft:heart_of_the_sea':'🌊',
  'minecraft:oak_boat':'⛵','minecraft:elytra':'🕊️','minecraft:saddle':'🐎',
  'minecraft:happy_ghast_spawn_egg':'👻','minecraft:nautilus_shell':'🐚',
  'minecraft:minecart':'🛒','minecraft:warped_fungus_on_a_stick':'🍄',
  'minecraft:diamond_pickaxe':'⛏️','minecraft:iron_ore':'⛓️','minecraft:diamond':'💎',
  'minecraft:iron_ingot':'🔩','minecraft:ancient_debris':'🗿','minecraft:oak_log':'🪵',
  'minecraft:sculk':'🔮','minecraft:netherite_scrap':'🔧','minecraft:bone':'💀',
  'minecraft:zombie_head':'🧟','minecraft:creeper_head':'💥','minecraft:skeleton_skull':'☠️',
  'minecraft:echo_shard':'📡','minecraft:iron_sword':'⚔️','minecraft:cooked_chicken':'🍗',
  'minecraft:ender_pearl':'🫧','minecraft:blaze_rod':'🔥',
  'minecraft:wither_skeleton_skull':'🖤','minecraft:dragon_egg':'🐉',
  'minecraft:nether_star':'⭐','minecraft:elder_guardian_spawn_egg':'🐟',
};
const CAT_TITLE_DE={
  advancements:'Fortschritte',life:'Leben & Alltag',exploration:'Reisen',
  mining:'Mining',deaths:'Tode',combat:'Kampf',
};
const BOARD_TITLE_DE={
  'advancements':'Fortschritte','play-time':'Spielzeit','animals-bred':'Gezüchtet',
  'fish-caught':'Gefangen','villager-trades':'Dorfhandel','items-enchanted':'Verzaubert',
  'sleeps':'Geschlafen','jumps':'Sprünge','distance-total':'Reise total',
  'distance-walk-sprint':'Laufen+Sprint','distance-walk':'Gehen','distance-sprint':'Sprint',
  'distance-swim':'Schwimmen','distance-boat':'Boot','distance-elytra':'Elytra',
  'distance-horse':'Pferd','distance-happy-ghast':'Happy Ghast','distance-nautilus':'Nautilus',
  'distance-minecart':'Lore','distance-strider':'Strider','chests-opened':'Kisten geöffnet',
  'blocks-mined':'Blöcke abgebaut','ores':'Erze','diamonds-mined':'Diamanten',
  'iron-mined':'Iron','ancient-debris':'Ancient Debris','logs-mined':'Holz',
  'sculk-mined':'Sculk','tools-broken':'Werkzeuge zerbrochen','deaths':'Tode',
  'killed-by-zombie':'Tod durch Zombie','killed-by-creeper':'Tod durch Creeper',
  'killed-by-skeleton':'Tod durch Skelett','killed-by-warden':'Tod durch Warden',
  'hostile-kills':'Monster-Kills','farm-kills':'Farm-Kills','zombies':'Zombies',
  'skeletons':'Skelette','creepers':'Creepers','endermen':'Endermen','blazes':'Blazes',
  'wither-skeletons':'Wither-Skelette','ender-dragon':'Enderdrache','wither':'Wither',
  'warden':'Warden','elder-guardian':'Elder Guardian','bosses':'Boss-Kills',
  'raids-won':'Raids gewonnen','player-kills':'Spieler-Kills','damage-dealt':'Schaden verteilt',
  'kills-per-hour':'Kills/h',
};

let DATA=null;
let ACTIVE_CAT=null;

async function api(path){
  // Two engines: fetch first; if the response smells like HTML (edge/gate
  // hiccup), fall back to XHR which shares no fetch-internal state.
  for(let engine=0;engine<2;engine++){
    let status=-1, ctype='', text='';
    try{
      if(engine===0){
        const r=await fetch(path,{credentials:'same-origin',cache:'no-store'});
        status=r.status; ctype=r.headers.get('content-type')||'';
        if(status===401){location.href='/login';throw new Error('anon');}
        if(status===0){continue;}
        if(!r.ok) throw new Error('http-'+status);
        text=await r.text();
      }else{
        const x=await new Promise((res,rej)=>{
          const xhr=new XMLHttpRequest();
          xhr.open('GET',path,true);
          xhr.withCredentials=true;
          xhr.onload=()=>res(xhr);
          xhr.onerror=()=>rej(new Error('xhr-error'));
          xhr.send();
        });
        status=x.status; ctype=x.getResponseHeader('content-type')||'';
        if(status===401){location.href='/login';throw new Error('anon');}
        if(status!==200) throw new Error('http-'+status);
        text=x.responseText;
      }
      if(!ctype.includes('json') && !text.trim().startsWith('{')){
        continue;   // HTML masquerade: try the other engine
      }
      return JSON.parse(text);
    }catch(err){
      if(err&&err.message==='anon') throw err;
      if(engine===1) throw err instanceof Error ? err : new Error(String(err));
      // else fall through to XHR engine
    }
  }
  throw new Error('unreachable-engine');
}

function paintHeader(me){
  qs('#userArea').innerHTML=`
    <a class="chip" href="/dashboard.html">
      <img src="/avatar/${encodeURIComponent(me.nickname)}.png" alt="">
      <span>${esc(me.nickname)}</span>
    </a>
    <a class="linkish" href="/">Übersicht</a>
    ${me.role==='admin'?'<a class="linkish" href="/admin">Admin</a>':''}
    <button class="linkish" id="navLogout" style="padding:8px 10px">Logout</button>`;
  qs('#navLogout').addEventListener('click',async ()=>{
    try{await api('POST','/api/logout');}catch(_){}
    location.href='/login';
  });
}

function paintSidebar(){
  const sb=qs('#catSidebar');
  const cats=(DATA.categories||[]).map(c=>({
    id:c.id, icon:c.icon, count:(c.boards||[]).length}));
  sb.innerHTML=cats.map(c=>`
<button class="sb-cat${c.id===ACTIVE_CAT?' active':''}" data-cat="${esc(c.id)}">
  <span class="ci">${ICON_EMOJI[c.icon]||'📊'}</span>
  <span>${esc(CAT_TITLE_DE[c.id]||c.id)}</span>
  <span class="sb-count">${c.count}</span>
</button>`).join('');
}

function paintBoards(){
  const area=document.getElementById('boardArea');
  const cat=(DATA.categories||[]).find(c=>c.id===ACTIVE_CAT);
  if(!cat){area.innerHTML='';return;}
  area.innerHTML=`
<h3 class="mod-cat-label" style="margin:0 0 16px">
  <span class="big-icon">${ICON_EMOJI[cat.icon]||'📊'}</span>
  <span style="font-size:18px;color:var(--ink);letter-spacing:0;text-transform:none;font-family:var(--font-body);font-weight:700">
    ${esc(CAT_TITLE_DE[cat.id]||cat.id)}</span>
</h3>
<div class="mod-grid">
${(cat.boards||[]).map(b=>{
  const leaders=(b.leaders||[]);
  const emoji=ICON_EMOJI[b.icon]||'📈';
  const title=BOARD_TITLE_DE[b.id]||b.id;
  return `
  <article class="board">
    <h4><span class="bi">${emoji}</span>
        <span>${esc(title)}</span>
        <span class="bu">${esc(b.unit||'')}</span></h4>
    ${leaders.length?`<ol>${leaders.map((r,i)=>`
    <li>
      <span class="rk">${i+1}</span>
      <span class="nm"><img src="/avatar/${encodeURIComponent(r.name)}.png" alt="">${esc(r.name)}</span>
      <span class="vl">${esc(r.display??r.value)}</span>
    </li>`).join('')}</ol>`
  :'<p class="empty">noch keine daten</p>'}
  </article>`;
}).join('')}
</div>`;
}

function paintProfiles(){
  const pt=document.getElementById('profileTiles');
  pt.innerHTML=((DATA.profiles||[])).map(p=>`
<a class="ptile" href="#" onclick="return false;">
  <img class="av" src="/avatar/${encodeURIComponent(p.name)}.png" alt="">
  <div>
    <div class="pname">${esc(p.name)}</div>
    <div class="pmeta">${esc(Math.round(p.playHours*100)/100)} h · `+
      `${esc(p.advancementsDone)}/${esc(p.advancementsTotal)} Fortschritte</div>
  </div>
</a>`).join('');
}

document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-cat]');
  if(b){
    ACTIVE_CAT=b.dataset.cat;
    paintSidebar(); paintBoards();
    if(history.replaceState) history.replaceState(null,'','#'+ACTIVE_CAT);
  }
});

(async()=>{
  qs('#yr').textContent=new Date().getFullYear();
  // Calm boot: ONE quiet request, generous spacing. Bursty parallel
  // fetches during page settle can trip edge challenges (observed as
  // HTML-instead-of-JSON); patience beats brute-force retries.
  qs('#updatedLine').textContent='// verbinde …';
  let done=false;
  for(let i=0;i<4 && !done;i++){
    try{
      await new Promise(ok=>setTimeout(ok, i===0?1500:3000*i));
      DATA=await api('GET','/api/stats/ingame');
      done=true;
      break;
    }catch(err){
      if(err&&(err.message==='anon')){return;}
      if(i===3){
        qs('#updatedLine').textContent='// fehler: '+err.message;
        document.getElementById('boardArea').innerHTML=
          '<div class="panel"><h2>Statistiken nicht verfügbar</h2>'+
          '<p class="desc">('+esc(err.message)+') — Seite später neu laden.</p></div>';
        return;
      }
    }
  }
  try{ paintHeader((await api('GET','/api/me')).user); }catch(_){}
  const cats=DATA.categories||[];
  const hashCat=(location.hash||'').replace('#','');
  ACTIVE_CAT = cats.some(c=>c.id===hashCat) ? hashCat
             : (cats[0]?cats[0].id:null);
  paintSidebar(); paintBoards(); paintProfiles();
  const lf=DATA.archive&&DATA.archive.lastFetch;
  qs('#updatedLine').textContent = lf ?
    `// archiv-stand: ${new Date(lf*1000).toLocaleString('de-DE')} · pulle alle 10 min` :
    '// archiv-leer';
  setInterval(async()=>{
    try{
      DATA=await api('GET','/api/stats/ingame');
      paintSidebar(); paintBoards(); paintProfiles();
    }catch(_){}
  },120000);
})();
</script>

</body>
</html>
