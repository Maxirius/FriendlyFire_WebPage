# minecraft_site nginx configuration — session-gated site.
#
# Model: nginx enforces the login wall (auth_request -> minecraft_auth /gate),
# the FastAPI service is defense-in-depth. Public pages: /login /register
# /forgot /reset /assets/*. Everything else requires a valid session cookie.
#
# Upstream addressing uses variables + docker's embedded resolver so nginx
# starts cleanly even when minecraft_auth is temporarily absent (requests
# degrade to 502 instead of crashing the whole site container).

resolver 127.0.0.11 valid=30s ipv6=off;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- security headers ----------------------------------------------
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # ---- auth gate ------------------------------------------------------
    location = /gate {
        internal;
        set $auth_target http://minecraft_auth:8000;
        proxy_pass              $auth_target;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";
        proxy_set_header        Cookie $http_cookie;
        proxy_set_header        X-Real-IP $remote_addr;
        proxy_connect_timeout   3s;
        proxy_read_timeout      5s;
        # NOTE: deliberately no caching anywhere near this location.
    }

    # ---- API + special endpoints -> FastAPI ------------------------------
    location ~ ^/(api|avatar)/ {
        set $api_target http://minecraft_auth:8000;
        proxy_pass $api_target;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location ~ ^/(invite|reset)/ {
        set $lnk_target http://minecraft_auth:8000;
        proxy_pass $lnk_target;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 10s;
    }

    location = /whitelist.txt {
        set $wl_target http://minecraft_auth:8000;
        proxy_pass $wl_target;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # latency beacon for the in-page ping test (tiny 204)
    location = /ping {
        set $ping_target http://minecraft_auth:8000;
        proxy_pass $ping_target;
        proxy_set_header Host $host;
    }

    # ---- static assets (CSS/fonts) — public -------------------------------
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ---- public auth pages -------------------------------------------------
    location = /login  { try_files /login.html  =404; }
    location = /register { try_files /register.html =404; }
    location = /forgot { try_files /forgot.html =404; }
    location = /reset  { try_files /reset.html =404; }

    # favicon etc.
    location = /favicon.ico { try_files $uri =204; }

    # ---- everything else: gated ----------------------------------------
    location / {
        auth_request /gate;
        error_page 401 =302 /login;
        try_files $uri $uri.html $uri/ /index.html;
    }
}
