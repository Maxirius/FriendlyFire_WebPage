<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login · FriendlyFire Minecraft</title>

<link rel="stylesheet" href="/assets/site.css?v=2">
<style>
.logo-lock{width:44px;height:44px;border:1px solid var(--border);
  background:var(--panel-2);display:flex;align-items:center;justify-content:center;
  margin-bottom:20px;}
.logo-lock svg{color:var(--amber);}
.testphase-banner{
  border:1px dashed var(--amber);
  background:rgba(255,195,92,.07);
  padding:10px 14px;
  font-size:13px;
  line-height:1.5;
  color:var(--amber);
}
.testphase-banner strong{text-transform:uppercase;letter-spacing:.06em;}
</style>
</head>
<body>
<script src="/assets/auth-bg.js?v=2" defer></script>

<header class="top">
  <div class="wrap nav">
    <!-- PLACEHOLDER: wordmark = technisch bis Markenname steht -->
    <a class="wordmark" href="/">MC.<em>MAX-KUEHN</em>.COM</a>
    <nav class="userarea"></nav>
  </div>
</header>

<main class="center-shell">
  <form class="card" id="loginForm" method="post" autocomplete="on">
    <div class="brand-mark">FRIENDLY<b>FIRE</b> · SPIELERBEREICH</div>
    <div class="logo-lock">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <rect x="4" y="10" width="16" height="11" stroke="currentColor" stroke-width="2"/>
        <path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="2"/>
        <circle cx="12" cy="15.5" r="1.6" fill="currentColor"/>
      </svg>
    </div>
    <div class="testphase-banner">
      <strong>Testphase:</strong> Diese Seite befindet sich noch im Aufbau —
      es können vereinzelt Fehler auftreten.
    </div>
    <h1>Anmelden</h1>
    <p class="sub">Mit deinem Community-Account einloggen.</p>

    <div class="field">
      <label for="email">E-Mail</label>
      <input type="email" id="email" name="email" required autofocus>
    </div>
    <div class="field">
      <label for="password">Passwort</label>
      <input type="password" id="password" name="password" required>
    </div>

    <button class="btn" type="submit" id="submitBtn">Anmelden</button>
    <p class="form-msg" id="msg" role="alert"></p>

    <div class="alt-row">
      <a href="/forgot">Passwort vergessen?</a>
      <span>Noch kein Account? Nur per <a href="#">Einladung</a></span>
    </div>
  </form>
</main>

<script>
const ERRORS={
  wrong_credentials:'E-Mail oder Passwort ist falsch.',
  rate_limited:'Zu viele Versuche — bitte kurz warten.',
  missing_origin:'Bitte Seite direkt über mc.max-kuehn.com aufrufen.',
};

// Already logged in? Straight to the account area.
(async()=>{
  try{
    const r=await fetch('/api/me',{credentials:'same-origin'});
    if(r.ok) location.replace('/');
  }catch(_){}
})();

document.getElementById('loginForm').addEventListener('submit',async ev=>{
  ev.preventDefault();
  const btn=document.getElementById('submitBtn');
  const msg=document.getElementById('msg');
  btn.disabled=true;msg.className='form-msg';msg.textContent='';
  try{
    const r=await fetch('/api/login',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        email:document.getElementById('email').value.trim(),
        password:document.getElementById('password').value}),
    });
    if(r.ok){location.href='/';return;}
    const err=(await r.json().catch(()=>null))?.detail?.code;
    msg.textContent=ERRORS[err]||'Anmeldung fehlgeschlagen.';
    msg.classList.add('err');
  }catch(_){
    msg.textContent='Netzwerkfehler — bitte erneut versuchen.';
    msg.classList.add('err');
  }finally{btn.disabled=false;}
});
</script>

</body>
</html>
